name: CI

on:
  push:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same pin as .pre-commit-config.yaml, so the hook and CI agree.
      - name: Install ruff
        run: python -m pip install ruff==0.13.0

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  pytest:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run tests with coverage
        id: pytest
        continue-on-error: true
        run: pytest --junitxml=junit.xml -o junit_family=legacy

      # Test results and coverage are reported once, from Python 3.11.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.11' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # One check named "tests", as before the version matrix (a required status check keeps working): it passes only when
  # every matrix leg passed.
  tests:
    runs-on: ubuntu-latest
    needs: pytest
    if: always()
    permissions: {}

    steps:
      - name: Require every Python version to pass
        run: test "${{ needs.pytest.result }}" = success

  wheel:
    name: built wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Check the wheel contains every module
        run: |
          python - << 'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          src = pathlib.Path("src")
          modules = [p.relative_to(src).as_posix() for p in (src / "perceptron").rglob("*.py") if "__pycache__" not in p.parts]
          missing = [m for m in modules if m not in names]
          if missing:
              sys.exit(f"{wheel.name} is missing {missing}")
          print(f"{wheel.name} contains all {len(modules)} modules")
          PY

      - name: Install the wheel into a fresh virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl pytest

      # Run from outside the checkout so nothing can import the source tree.
      - name: Import smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - << 'PY'
          import perceptron
          import perceptron.chat, perceptron.dsl.perceive, perceptron.files, perceptron.models, perceptron.multilook
          import perceptron.pointing.parser
          assert "site-packages" in perceptron.__file__, perceptron.__file__
          print("perceptron", perceptron.__version__, "from", perceptron.__file__)
          PY

      - name: CLI smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/perceptron" --help
          "$RUNNER_TEMP/wheel-venv/bin/perceptron" question --help

      # PERCEPTRON_TEST_INSTALLED keeps src/ off sys.path (tests/conftest.py); tests/test_packaging.py then also checks
      # that the installed package is the one under test and holds every module.
      - name: Run the offline tests against the installed package
        env:
          PERCEPTRON_TEST_INSTALLED: '1'
        run: |
          export PERCEPTRON_TEST_WHEEL="$(ls "$PWD"/dist/*.whl)"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -p no:cacheprovider -o addopts="" -m "not integration" -rs tests

  coverage:
    runs-on: ubuntu-latest
    needs: pytest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          flags: sdk-tests
          fail_ci_if_error: true
          verbose: true
