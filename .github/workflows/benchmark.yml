name: Performance Benchmark

on:
  # Run daily at 9am UTC
  schedule:
    - cron: '0 9 * * *'
  # Allow manual triggering
  workflow_dispatch:
  # Run on PRs that modify benchmark tests
  pull_request:
    paths:
      - 'tests/test_benchmark_*.py'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Don't block on benchmark failures
    continue-on-error: true
    permissions:
      contents: read
      issues: write  # Allow creating issues if benchmark fails

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run benchmark tests
        id: benchmark
        continue-on-error: true
        env:
          PERCEPTRON_API_KEY: ${{ secrets.PERCEPTRON_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PERCEPTRON_BASE_URL: ${{ secrets.PERCEPTRON_BASE_URL || 'https://api.perceptron.inc/v1' }}
        run: |
          # Run benchmark and capture output
          pytest tests/test_benchmark_fal_vs_perceptron.py \
            --benchmark-json=benchmark-results.json \
            -v -s 2>&1 | tee benchmark-output.txt

          # Store exit code
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-output.txt
          retention-days: 30

      - name: Extract benchmark summary
        if: always()
        id: summary
        run: |
          if [ -f benchmark-results.json ]; then
            # Extract mean times from benchmark JSON
            python3 << 'EOF'
          import json
          import sys

          try:
              with open('benchmark-results.json', 'r') as f:
                  data = json.load(f)

              benchmarks = data.get('benchmarks', [])

              fal_bench = next((b for b in benchmarks if 'fal' in b['name']), None)
              perceptron_bench = next((b for b in benchmarks if 'perceptron' in b['name']), None)

              if fal_bench and perceptron_bench:
                  fal_mean = fal_bench['stats']['mean']
                  perceptron_mean = perceptron_bench['stats']['mean']
                  diff_ms = (perceptron_mean - fal_mean) * 1000
                  diff_pct = ((perceptron_mean / fal_mean - 1) * 100)

                  print(f"fal_mean={fal_mean:.4f}")
                  print(f"perceptron_mean={perceptron_mean:.4f}")
                  print(f"diff_ms={diff_ms:.2f}")
                  print(f"diff_pct={diff_pct:+.2f}")

                  # Check if significantly slower
                  if diff_pct > 20:
                      print("status=⚠️ WARNING: Perceptron is >20% slower")
                      sys.exit(1)
                  elif diff_pct > 0:
                      print(f"status=✓ Perceptron is {diff_pct:.1f}% slower (acceptable)")
                  else:
                      print(f"status=✓ Perceptron is {abs(diff_pct):.1f}% faster")
              else:
                  print("status=⚠️ Could not extract benchmark data")
          except Exception as e:
              print(f"status=⚠️ Error processing results: {e}")
          EOF
          fi >> $GITHUB_OUTPUT

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📊 Benchmark Results\n\n';

            try {
              const output = fs.readFileSync('benchmark-output.txt', 'utf8');
              const resultsMatch = output.match(/Benchmark Results:([\s\S]*?)={60}/);

              if (resultsMatch) {
                comment += '```\n' + resultsMatch[0] + '```\n';
              } else {
                comment += '⚠️ Could not extract benchmark results from output.\n';
              }

              comment += '\n*Note: This benchmark is informational only and does not block PR merges.*\n';

              // Find existing benchmark comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('📊 Benchmark Results')
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not post comment:', error);
            }

      - name: Create issue if benchmark fails significantly
        if: |
          github.event_name == 'schedule' &&
          steps.benchmark.outputs.exit_code != '0' &&
          contains(steps.summary.outputs.status, 'WARNING')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark-output.txt', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Performance Regression: Perceptron significantly slower than Fal',
              labels: ['performance', 'benchmark'],
              body: `## Performance Benchmark Alert

            The weekly benchmark test detected that Perceptron is significantly slower than Fal.

            **Status:** ${process.env.SUMMARY_STATUS}

            ### Benchmark Output
            \`\`\`
            ${output}
            \`\`\`

            ### Actions Required
            - Review the benchmark results artifact
            - Investigate potential performance regressions
            - Compare with historical benchmark data

            **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            `
            });

      - name: Summary
        if: always()
        run: |
          echo "### Benchmark Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f benchmark-output.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep -A 20 "Benchmark Results:" benchmark-output.txt >> $GITHUB_STEP_SUMMARY || echo "No results found" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Benchmark did not complete - check if API keys are configured" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This benchmark is informational and does not block builds." >> $GITHUB_STEP_SUMMARY
